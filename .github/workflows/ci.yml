name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lint
        run: |
          node --check lib/js/checklist.js
          node --check scripts/build.js
          node --check scripts/serve.js
          node --check tests/checklist.test.js
          node --check tests/build.test.js
          node --check tests/browser_smoke.mjs
      - name: Test
        run: |
          node --test tests/checklist.test.js tests/build.test.js
      - name: Rebuild and confirm generated pages are committed
        run: |
          node scripts/build.js
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            exit 1
          fi
      - uses: browser-actions/setup-chrome@v1
      - name: Browser smoke
        run: node tests/browser_smoke.mjs
